name: CI

on:
  pull_request:
  push:
    branches: [master, main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and production builds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      # The generated Prisma client is git-ignored, so it does not exist in a
      # clean checkout and every typecheck and build that imports it would fail.
      # This needs no database — `generate` only reads schema.prisma.
      - name: Generate the Prisma client
        run: pnpm db:generate

      # Catches a schema.prisma that parses but is not a valid data model, which
      # `generate` alone will not always reject.
      - name: Validate the Prisma schema
        run: pnpm db:validate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Every workspace package now has a real suite or no `test` script at all.
      # `--passWithNoTests` was removed package by package so a green run here
      # means assertions actually executed. Do not reintroduce the flag.
      - name: Run real test suites
        run: pnpm test

      - name: Check generated OpenAPI contract
        run: pnpm openapi:check

      - name: Review production dependency licenses
        run: pnpm security:licenses

      # docs/BASELINE_M0.md is deliberately NOT regenerated or drift-checked
      # here. It is a frozen pre-stabilization capture, so a CI job that kept it
      # matching `main` would destroy the only thing it is for. The counts that
      # must not drift are asserted in apps/web/test/legacy-assets.spec.ts,
      # which the test step above already runs.

      - name: Build production artifacts
        env:
          PUBLIC_SITE_URL: https://example.com
          BIRTH_DATE: 2000-01-01
        run: pnpm build

  appearance:
    name: Appearance and accessibility matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm db:generate

      # The web app resolves every workspace package through `dist/`, so the
      # suite would run against a stale contract without this.
      - name: Build workspace packages
        run: pnpm build:packages

      - name: Install the pinned browser
        run: pnpm --filter @portfolio/web exec playwright install --with-deps chromium

      # THEMING.md §9's browser half: first-response and hydration agreement,
      # `system` resolution, cookie tampering, allowlist enforcement, shared-cache
      # behaviour, blog-typography scoping, font requests, reduced motion, dialog
      # accessibility, the legacy migration, code-block theming, and the CSP and
      # security headers on both a public page and the localized 503.
      #
      # The Playwright config builds and starts the app itself and stands up the
      # fixture public API, so this needs no database, object store, or API
      # process. What it does need is the same `next build` the quality job runs,
      # which is why this is a separate job rather than a step appended to it.
      - name: Run the appearance and accessibility matrix
        run: pnpm --filter @portfolio/web test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Full history: the point is to catch a credential that was committed and
      # then "removed" in a later commit, which is exactly how the EmailJS keys
      # became a problem. A shallow clone would miss those.
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Free for personal accounts and public repositories. Moving this
      # repository under a GitHub organization requires a GITLEAKS_LICENSE
      # secret, or this step will start failing.
      #
      # Scan repository history for credentials; article bodies live in PostgreSQL.
      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database-integration:
    name: Migration and database integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: portfolio_test
          POSTGRES_PASSWORD: portfolio_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_test -d portfolio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://portfolio_test:portfolio_test_password@127.0.0.1:5432/portfolio_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Apply every migration from zero
        run: pnpm --filter @portfolio/database exec prisma migrate deploy
      - name: Run database behavior suites
        run: pnpm --filter @portfolio/database test

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - run: pnpm security:licenses

  containers:
    name: Hardened images, SBOM, and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose topology
        run: >-
          docker compose
          --env-file infrastructure/docker/.env.compose.example
          -f infrastructure/docker/compose.yaml
          -f infrastructure/docker/compose.production.yaml
          --profile full config --quiet
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: api-runtime
          load: true
          tags: portfolio-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: portfolio-web:ci
          build-args: |
            PUBLIC_SITE_URL=https://example.invalid
            API_INTERNAL_ORIGIN=http://api:4000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build operations image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/ops.Dockerfile
          load: true
          tags: portfolio-ops:ci
          cache-from: type=gha,scope=ops
          cache-to: type=gha,mode=max,scope=ops
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: portfolio-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: portfolio-web:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan operations image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: portfolio-ops:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Generate API SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          image: portfolio-api:ci
          format: spdx-json
          output-file: api.spdx.json
      - name: Generate web SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          image: portfolio-web:ci
          format: spdx-json
          output-file: web.spdx.json
      - name: Generate operations SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          image: portfolio-ops:ci
          format: spdx-json
          output-file: ops.spdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: container-sboms
          path: "*.spdx.json"
          retention-days: 30
