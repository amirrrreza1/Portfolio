name: portfolio

x-app-security: &app-security
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  tmpfs:
    - /tmp:size=64m,mode=1777
  restart: unless-stopped

x-api-environment: &api-environment
  NODE_ENV: production
  API_HOST: 0.0.0.0
  API_PORT: 4000
  API_TRUST_PROXY_HOPS: ${API_TRUST_PROXY_HOPS:-2}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_REGION: us-east-1
  MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
  MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:?MINIO_ACCESS_KEY_ID is required}
  MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:?MINIO_SECRET_ACCESS_KEY is required}
  MINIO_FORCE_PATH_STYLE: "true"
  SMTP_URL: ${SMTP_URL:?SMTP_URL is required}
  CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:?CONTACT_FROM_EMAIL is required}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
  RECOVERY_SECRET: ${RECOVERY_SECRET:?RECOVERY_SECRET is required}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID is required}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Portfolio Admin}
  WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?WEBAUTHN_ORIGIN is required}
  CACHE_INVALIDATION_SECRET: ${CACHE_INVALIDATION_SECRET:?CACHE_INVALIDATION_SECRET is required}
  CACHE_INVALIDATION_URL: http://web:3000/api/invalidate
  PUBLICATION_QUEUE_MAX_AGE_SECONDS: ${PUBLICATION_QUEUE_MAX_AGE_SECONDS:-300}

services:
  postgres:
    image: postgres:17.6-bookworm
    profiles: [dependencies, full, test]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    profiles: [dependencies, full, test]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    networks: [data]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    profiles: [dependencies, full, test]
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing "local/$${MINIO_BUCKET}";
        mc anonymous set none "local/$${MINIO_BUCKET}";
        mc version enable "local/$${MINIO_BUCKET}";
        printf '%s\n' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::'"$${MINIO_BUCKET}"'"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::'"$${MINIO_BUCKET}"'/*"]}]}' > /tmp/portfolio-app-policy.json;
        mc admin user add local "$${MINIO_ACCESS_KEY_ID}" "$${MINIO_SECRET_ACCESS_KEY}";
        mc admin policy create local portfolio-app /tmp/portfolio-app-policy.json;
        mc admin policy attach local portfolio-app --user "$${MINIO_ACCESS_KEY_ID}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:?MINIO_ACCESS_KEY_ID is required}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:?MINIO_SECRET_ACCESS_KEY is required}
    networks: [data]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: [dependencies, test]
    networks: [services]
    restart: unless-stopped

  migrate:
    profiles: [full]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  api:
    <<: *app-security
    profiles: [full]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: api-runtime
    environment: *api-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    networks: [app, data, services, egress]
    mem_limit: 768m
    cpus: 1.0

  publication:
    <<: *app-security
    profiles: [full]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: worker
    command: [node, dist/worker/main.js, --mode=publication]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CACHE_INVALIDATION_SECRET: ${CACHE_INVALIDATION_SECRET:?CACHE_INVALIDATION_SECRET is required}
      CACHE_INVALIDATION_URL: http://web:3000/api/invalidate
      PUBLICATION_WORKER_LEASE_SECONDS: ${PUBLICATION_WORKER_LEASE_SECONDS:-300}
      PUBLICATION_WORKER_IDLE_MS: ${PUBLICATION_WORKER_IDLE_MS:-2000}
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    networks: [data, services, app]
    mem_limit: 512m
    cpus: 0.5

  scheduler:
    <<: *app-security
    profiles: [full]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: worker
    command: [node, dist/worker/main.js, --mode=scheduler]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-60}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [data]
    mem_limit: 256m
    cpus: 0.25

  maintenance:
    <<: *app-security
    profiles: [full]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: worker
    command: [node, dist/worker/main.js, --mode=maintenance]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: us-east-1
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:?MINIO_ACCESS_KEY_ID is required}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:?MINIO_SECRET_ACCESS_KEY is required}
      MINIO_FORCE_PATH_STYLE: "true"
      SMTP_URL: ${SMTP_URL:?SMTP_URL is required}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:?CONTACT_FROM_EMAIL is required}
      CONTACT_DELIVERY_MAX_ATTEMPTS: ${CONTACT_DELIVERY_MAX_ATTEMPTS:-5}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-900}
      MAINTENANCE_BATCH_SIZE: ${MAINTENANCE_BATCH_SIZE:-100}
      DRAFT_RETENTION_DAYS: ${DRAFT_RETENTION_DAYS:-30}
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}
      QUARANTINE_RETENTION_DAYS: ${QUARANTINE_RETENTION_DAYS:-14}
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    networks: [data, services, egress]
    mem_limit: 512m
    cpus: 0.5

  backup:
    profiles: [full]
    build:
      context: ../..
      dockerfile: infrastructure/docker/ops.Dockerfile
    command: [/opt/portfolio/bin/backup-scheduler.sh]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:?MINIO_ACCESS_KEY_ID is required}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:?MINIO_SECRET_ACCESS_KEY is required}
      BACKUP_DIR: /backups
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_CHAT_ID_FILE: /run/secrets/telegram_chat_id
      TZ: ${BACKUP_TIME_ZONE:-UTC}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_HEALTH_MAX_AGE_MINUTES: ${BACKUP_HEALTH_MAX_AGE_MINUTES:-1560}
      TELEGRAM_MAX_FILE_BYTES: ${TELEGRAM_MAX_FILE_BYTES:-45000000}
      TELEGRAM_UPLOAD_RETRIES: ${TELEGRAM_UPLOAD_RETRIES:-4}
    secrets:
      - backup_passphrase
      - telegram_bot_token
      - telegram_chat_id
    volumes:
      - backup-data:/backups
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [data, egress]
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: [CMD, /opt/portfolio/bin/backup-healthcheck.sh]
      interval: 5m
      timeout: 5s
      retries: 3
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  web:
    <<: *app-security
    profiles: [full]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
        API_INTERNAL_ORIGIN: http://api:4000
    environment:
      NODE_ENV: production
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
      API_INTERNAL_ORIGIN: http://api:4000
      # The code also defaults to database after cutover. Keep this explicit in
      # the production topology so `docker compose config` proves the active
      # source without relying on an application default.
      PORTFOLIO_DATA_SOURCE: database
      CACHE_INVALIDATION_SECRET: ${CACHE_INVALIDATION_SECRET:?CACHE_INVALIDATION_SECRET is required}
    depends_on:
      api: { condition: service_healthy }
    networks: [app, egress]
    mem_limit: 768m
    cpus: 1.0

  edge:
    image: caddy:2.10.2-alpine
    profiles: [full]
    depends_on:
      web: { condition: service_healthy }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-https://localhost}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [app, egress]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  app: { internal: true }
  data: { internal: true }
  services: { internal: true }
  egress: {}

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
  backup-data:

secrets:
  backup_passphrase:
    file: ${BACKUP_PASSPHRASE_PATH:-./secrets/backup-passphrase}
  telegram_bot_token:
    file: ${TELEGRAM_BOT_TOKEN_PATH:-./secrets/telegram-bot-token}
  telegram_chat_id:
    file: ${TELEGRAM_CHAT_ID_PATH:-./secrets/telegram-chat-id}
